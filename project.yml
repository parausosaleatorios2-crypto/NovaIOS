# project.yml — XcodeGen
#
# Gera NovaEditor.xcodeproj. No Mac:
#   brew install xcodegen
#   xcodegen generate
#   open NovaEditor.xcodeproj
#
# Sem XcodeGen, veja Docs/COMPILAR.md para montar o projeto a mao.

name: NovaEditor
options:
  bundleIdPrefix: com.novavision
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MTL_LANGUAGE_REVISION: Metal30
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 1.439 .metal num alvo so: sem isto o link da metallib estoura o tempo.
    MTL_ENABLE_INDEX_STORE: NO
  configs:
    debug:
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    release:
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  NovaEditor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shaders
        # Os .metal entram na fase de compilacao de fontes, nao em recursos.
      - path: Resources
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nova Editor
        CFBundleShortVersionString: "0.918.0"
        CFBundleVersion: "937"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        # Equivalentes das permissoes do AndroidManifest.
        NSPhotoLibraryUsageDescription:
          Para trazer fotos e vídeos da sua galeria para os projetos.
        NSPhotoLibraryAddUsageDescription:
          Para salvar na galeria o vídeo que você exportar.
        NSMicrophoneUsageDescription:
          Para gravar narração e som direto na timeline.
        NSCameraUsageDescription:
          Para gravar vídeo direto para o projeto.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Projeto NovaEditor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.novavision.editor.nova]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.novavision.editor.nova
            UTTypeDescription: Projeto NovaEditor
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [nova]
              public.mime-type: [application/x-nova]
        CFBundleURLTypes:
          - CFBundleURLName: com.novavision.editor
            CFBundleURLSchemes: [novaeditor]
    entitlements:
      path: NovaEditor.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:novavisionhub-3.onrender.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novavision.editor
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone e iPad
        # Preencha com o seu time. Sem isto nao ha assinatura e nao ha IPA.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
