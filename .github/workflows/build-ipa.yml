name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: write   # publicar o IPA na pagina de Releases
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode mais novo
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Compilar shaders um a um (separar os quebrados)
        run: |
          mkdir -p build/air build/err Shaders-excluidos
          : > build/falhas.txt; : > build/reparados.txt
          ls Shaders/*.metal | xargs -P 6 -n 1 sh Tools/compilar-shader.sh
          for core in NovaBlend NovaFullscreen; do
            if grep -q "/$core.metal" build/falhas.txt; then
              echo "::error::Shader base $core falhou"; cat "build/err/$core.txt"; exit 1
            fi
          done
          TOTAL=$(ls Shaders/fx_*.metal | wc -l | tr -d ' ')
          FAIL=$(wc -l < build/falhas.txt | tr -d ' ')
          REP=$(wc -l < build/reparados.txt | tr -d ' ')
          echo "Shaders fx: $TOTAL, reparados: $REP, com erro: $FAIL"
          cat build/err/*.rep.txt > build/erros-reparados.txt 2>/dev/null || true
          cat build/err/*.txt > build/erros-shaders.txt 2>/dev/null || true
          grep -ohE "error: .*" build/erros-reparados.txt | sed -E "s/'[^']*'/X/g" | sort | uniq -c | sort -rn | head -40 || true
          while read -r f; do [ -n "$f" ] && mv "$f" Shaders-excluidos/; done < build/falhas.txt
          echo "### Shaders: $((TOTAL-FAIL)) de $TOTAL compilaram ($REP reparados)" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir EngineUniforms (Swift x Metal)
        run: python3 -I Tools/gerar_uniforms_h.py --check

      # Aplica cada efeito numa imagem de teste com o mesmo motor do app, no
      # Mac do runner, e grava verificacao/efeitos.json: o app esconde os que
      # sairem pretos, transparentes, com NaN ou com erro.
      - name: Sonda de efeitos (macOS)
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p build/airmac
          : > build/falhas-mac.txt
          ls Shaders/*.metal | xargs -P 6 -n 1 sh Tools/compilar-shader-mac.sh
          echo "falharam no macOS: $(wc -l < build/falhas-mac.txt)"
          xcrun -sdk macosx metallib build/airmac/*.air -o build/probe.metallib
          swift build -c release --product nova-effect-probe
          .build/release/nova-effect-probe build/probe.metallib Resources/effects Resources             build/efeitos-verificados.json | tee build/sonda.txt
          cp build/efeitos-verificados.json Resources/verificacao/efeitos.json
          { echo '### Sonda de efeitos'; echo '```'; cat build/sonda.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar app (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project NovaEditor.xcodeproj -scheme NovaEditor \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|\*\* BUILD"
          APP=build/dd/Build/Products/Release-iphoneos/NovaEditor.app
          test -f "$APP/NovaEditor" || { echo "::error::app sem executavel"; exit 1; }
          test -f "$APP/default.metallib" || { echo "::error::app sem metallib"; exit 1; }

      - name: Validar bundle para instalacao
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/NovaEditor.app
          ls "$APP" | head -50
          test ! -e "$APP/Resources" || { echo "::error::pasta Resources na raiz do .app quebra a assinatura"; exit 1; }
          test -d "$APP/effects" || { echo "::error::effects fora da raiz do .app"; exit 1; }
          test -f "$APP/i18n/en.json" || { echo "::error::i18n/en.json fora da raiz do .app"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::sem Assets.car (icone)"; exit 1; }
          ls "$APP" | grep -i appicon || { echo "::error::sem arquivos AppIcon"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist"
          find "$APP" -type l | head -5
          # assinatura ad-hoc numa copia: e o que o eSign faz com o certificado dele
          rm -rf /tmp/teste && mkdir /tmp/teste && cp -R "$APP" /tmp/teste/
          codesign --force --sign - --timestamp=none /tmp/teste/NovaEditor.app
          codesign --verify --deep --strict --verbose=2 /tmp/teste/NovaEditor.app

      - name: Empacotar IPA
        run: |
          mkdir -p out/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/NovaEditor.app out/Payload/
          cd out && zip -qry NovaEditor-unsigned.ipa Payload
          ls -lh NovaEditor-unsigned.ipa

      # O IPA (~150 MB) passa do limite de 100 MB por arquivo do git, entao vai
      # para a pagina de Releases: sempre o mesmo link, baixavel pelo celular.
      - name: Publicar IPA em Releases (ipa-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ipa-latest
          FX=$(( $(ls Shaders/fx_*.metal | wc -l) ))
          {
            echo "IPA sem assinatura do commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Efeitos compilados: ${FX}."
            echo
            echo "Instale pelo eSign (ele assina no aparelho)."
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" out/NovaEditor-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NovaEditor IPA (último build)" --notes-file notes.md --latest

      - uses: actions/upload-artifact@v4
        with:
          name: NovaEditor-ipa
          path: out/NovaEditor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build/xcodebuild.log
            build/falhas.txt
            build/erros-shaders.txt
            build/erros-reparados.txt
            build/reparados.txt
            build/efeitos-verificados.json
            build/sonda.txt
