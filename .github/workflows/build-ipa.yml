name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode mais novo
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project NovaEditor.xcodeproj -scheme NovaEditor \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build/xcodebuild.log | grep -E "error:|warning: .*metal|BUILD" || true
          test -d build/dd/Build/Products/Release-iphoneos/NovaEditor.app

      - name: Empacotar IPA
        run: |
          mkdir -p out/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/NovaEditor.app out/Payload/
          cd out && zip -qry NovaEditor-unsigned.ipa Payload
          ls -lh NovaEditor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NovaEditor-ipa
          path: out/NovaEditor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/xcodebuild.log
